<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RAG Visual Learning Tool</title>

  <!-- =======================
       BASIC MODERN STYLING
       ======================= -->
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .section {
      background: #020617;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 0 0 1px #1e293b;
    }

    .section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    textarea, input[type="file"] {
      width: 100%;
      margin-top: 8px;
    }

    textarea {
      height: 120px;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      margin-top: 12px;
      padding: 10px 14px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #1d4ed8;
    }

    .progress {
      color: #22c55e;
      font-size: 14px;
      margin-top: 6px;
    }

    .output-box {
      background: #020617;
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 10px;
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .chunk {
      padding: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .vector {
      font-family: monospace;
      color: #38bdf8;
    }

    .highlight {
      color: #facc15;
    }
  </style>
</head>

<body>

<h1>🔍 RAG Visual Learning Tool</h1>
<p class="subtitle">Understand Retrieval-Augmented Generation step by step</p>

<!-- =======================
     STEP 1: DATA INPUT
     ======================= -->
<div class="section">
  <h2>1️⃣ Input Data</h2>
  <p>Paste text or upload a <b>.txt / .pdf</b> file</p>

  <textarea id="inputText" placeholder="Paste your text here..."></textarea>
  <input type="file" id="fileInput" accept=".txt,.pdf" />

  <div id="inputStatus" class="progress"></div>
</div>

<!-- =======================
     STEP 2: CHUNKING
     ======================= -->
<div class="section">
  <h2>2️⃣ Chunking</h2>

  <label>Chunk Size (max 50 words)</label>
  <input type="range" id="chunkSize" min="5" max="50" value="20" />

  <label>Overlap (max 10 words)</label>
  <input type="range" id="overlapSize" min="0" max="10" value="5" />

  <button onclick="createChunks()">Create Chunks</button>
  <div id="chunkStatus" class="progress"></div>
  <div id="chunksOutput" class="output-box"></div>
</div>

<!-- =======================
     STEP 3: EMBEDDINGS
     ======================= -->
<div class="section">
  <h2>3️⃣ Vector Embeddings</h2>
  <button onclick="createEmbeddings()">Generate Embeddings</button>
  <div id="embeddingStatus" class="progress"></div>
  <div id="embeddingsOutput" class="output-box"></div>
</div>

<!-- =======================
     STEP 4: RETRIEVAL
     ======================= -->
<div class="section">
  <h2>4️⃣ Query & Retrieval</h2>

  <textarea id="queryInput" placeholder="Enter your query..."></textarea>

  <label>Top-K Chunks (max 5)</label>
  <input type="range" id="topK" min="1" max="5" value="3" />

  <button onclick="retrieveChunks()">Retrieve Relevant Chunks</button>
  <div id="retrievalOutput" class="output-box"></div>
</div>

<!-- =======================
     STEP 5 & 6: PROMPT + ANSWER
     ======================= -->
<div class="section">
  <h2>5️⃣ Prompt → LLM → Answer</h2>
  <button onclick="generateAnswer()">Generate Answer</button>
  <div id="finalAnswer" class="output-box"></div>
</div>

<script>
/* =======================
   GLOBAL STATE
   ======================= */
let rawText = "";
let chunks = [];
let embeddings = [];
let retrievedChunks = [];

/* =======================
   FILE HANDLING
   ======================= */
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.type === "text/plain") {
    rawText = await file.text();
  } else {
    alert("PDF parsing is intentionally skipped to keep this demo simple.");
  }

  document.getElementById("inputText").value = rawText;
  document.getElementById("inputStatus").innerText = "✅ Data loaded";
});

/* =======================
   STEP 2: CHUNKING LOGIC
   ======================= */
function createChunks() {
  rawText = document.getElementById("inputText").value;
  if (!rawText) return;

  const chunkSize = +document.getElementById("chunkSize").value;
  const overlap = +document.getElementById("overlapSize").value;

  const words = rawText.split(/\s+/);
  chunks = [];

  for (let i = 0; i < words.length; i += (chunkSize - overlap)) {
    chunks.push(words.slice(i, i + chunkSize).join(" "));
  }

  document.getElementById("chunkStatus").innerText =
    `✅ Created ${chunks.length} chunks`;

  document.getElementById("chunksOutput").innerHTML =
    chunks.map((c, i) => `<div class="chunk"><b>Chunk ${i + 1}:</b> ${c}</div>`).join("");
}

/* =======================
   STEP 3: EMBEDDINGS
   ======================= */
function createEmbeddings() {
  embeddings = chunks.map(chunk => {
    // Fake but realistic embedding (10-D vector)
    return Array.from({ length: 10 }, () => Math.random().toFixed(2));
  });

  // Store locally to simulate vector DB
  localStorage.setItem("embeddings", JSON.stringify(embeddings));

  document.getElementById("embeddingStatus").innerText =
    "✅ Embeddings generated & stored locally";

  document.getElementById("embeddingsOutput").innerHTML =
    embeddings.map((v, i) =>
      `<div class="vector">Chunk ${i + 1}: [${v.join(", ")}]</div>`
    ).join("");
}

/* =======================
   COSINE SIMILARITY
   ======================= */
function cosineSim(a, b) {
  let dot = 0, magA = 0, magB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    magA += a[i] ** 2;
    magB += b[i] ** 2;
  }
  return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}

/* =======================
   STEP 4: RETRIEVAL
   ======================= */
function retrieveChunks() {
  const topK = +document.getElementById("topK").value;

  // Fake query embedding
  const queryEmbedding = Array.from({ length: 10 }, () => Math.random());

  const scored = embeddings.map((e, i) => ({
    chunk: chunks[i],
    score: cosineSim(
      e.map(Number),
      queryEmbedding
    )
  }));

  retrievedChunks = scored
    .sort((a, b) => b.score - a.score)
    .slice(0, topK);

  document.getElementById("retrievalOutput").innerHTML =
    retrievedChunks.map(r =>
      `<div><span class="highlight">Score:</span> ${r.score.toFixed(3)}<br>${r.chunk}</div><hr>`
    ).join("");
}

/* =======================
   STEP 5 & 6: PROMPT + ANSWER
   ======================= */
function generateAnswer() {
  const query = document.getElementById("queryInput").value;

  const prompt = `
You are an AI assistant.
Use the context below to answer the question.

Context:
${retrievedChunks.map(c => "- " + c.chunk).join("\n")}

Question:
${query}
`;

  // Simulated LLM response
  const answer = `
🧠 Generated Answer (Simulated):

Based on the retrieved chunks, the answer to your question
is constructed using the most relevant context available.

(This simulates how RAG feeds context into an LLM.)
`;

  document.getElementById("finalAnswer").innerText =
    "PROMPT SENT TO LLM:\n" + prompt + "\n\n" + answer;
}
</script>

</body>
</html>
