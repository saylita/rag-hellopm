<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visual RAG Learning Tool</title>

  <!-- ======================
       BASIC MODERN STYLES
       ====================== -->
  <style>
    body {
      font-family: Inter, system-ui, Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 24px;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .section {
      background: #020617;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 0 0 1px #1e293b;
    }

    .section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5f5;
    }

    textarea, input[type="number"], input[type="file"] {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
      font-size: 14px;
    }

    textarea {
      height: 120px;
    }

    button {
      margin-top: 14px;
      padding: 10px 16px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #22c55e;
    }

    .output {
      background: #020617;
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      max-height: 240px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .chunk {
      padding: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .vector {
      font-family: monospace;
      color: #38bdf8;
    }

    .score {
      color: #facc15;
      font-weight: 600;
    }
  </style>
</head>

<body>

<h1>🔍 RAG Visual Learning Tool</h1>
<p class="subtitle">Learn Retrieval-Augmented Generation step by step</p>

<!-- ======================
     STEP 1: INPUT DATA
     ====================== -->
<div class="section">
  <h2>1️⃣ Input Data</h2>

  <label>Paste your text</label>
  <textarea id="inputText" placeholder="Paste any text here..."></textarea>

  <label>Or upload a file (.txt / .pdf)</label>
  <input type="file" id="fileInput" accept=".txt,.pdf" />

  <div id="inputStatus" class="status"></div>
</div>

<!-- ======================
     STEP 2: CHUNKING
     ====================== -->
<div class="section">
  <h2>2️⃣ Chunking</h2>

  <label>Chunk size (max 50 words)</label>
  <input type="number" id="chunkSize" max="50" min="5" value="20" />

  <label>Overlap size (max 10 words)</label>
  <input type="number" id="overlapSize" max="10" min="0" value="5" />

  <button onclick="createChunks()">Create Chunks</button>

  <div id="chunkStatus" class="status"></div>
  <div id="chunksOutput" class="output"></div>
</div>

<!-- ======================
     STEP 3: EMBEDDINGS
     ====================== -->
<div class="section">
  <h2>3️⃣ Vector Embeddings</h2>

  <button onclick="generateEmbeddings()">Generate Embeddings</button>

  <div id="embeddingStatus" class="status"></div>
  <div id="embeddingsOutput" class="output"></div>
</div>

<!-- ======================
     STEP 4: RETRIEVAL
     ====================== -->
<div class="section">
  <h2>4️⃣ Query & Top-K Retrieval</h2>

  <label>User Query</label>
  <textarea id="queryInput" placeholder="Ask a question..."></textarea>

  <label>Top-K chunks to retrieve (max 5)</label>
  <input type="number" id="topK" max="5" min="1" value="3" />

  <button onclick="retrieveChunks()">Retrieve Relevant Chunks</button>

  <div id="retrievalOutput" class="output"></div>
</div>

<!-- ======================
     STEP 5 & 6: PROMPT + ANSWER
     ====================== -->
<div class="section">
  <h2>5️⃣ Prompt → LLM → Answer</h2>

  <button onclick="generateAnswer()">Generate Answer</button>

  <div id="finalOutput" class="output"></div>
</div>

<script>
/* ======================
   GLOBAL STATE
   ====================== */
let rawText = "";
let chunks = [];
let embeddings = [];
let topChunks = [];

/* ======================
   FILE INPUT HANDLING
   ====================== */
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.type === "text/plain") {
    rawText = await file.text();
    document.getElementById("inputText").value = rawText;
    document.getElementById("inputStatus").innerText = "✅ Text file loaded";
  } else {
    alert("PDF parsing is skipped to keep this demo simple.");
  }
});

/* ======================
   STEP 2: CHUNK CREATION
   ====================== */
function createChunks() {
  rawText = document.getElementById("inputText").value.trim();
  if (!rawText) return;

  const chunkSize = Number(document.getElementById("chunkSize").value);
  const overlap = Number(document.getElementById("overlapSize").value);

  const words = rawText.split(/\s+/);
  chunks = [];

  for (let i = 0; i < words.length; i += (chunkSize - overlap)) {
    chunks.push(words.slice(i, i + chunkSize).join(" "));
  }

  document.getElementById("chunkStatus").innerText =
    `✅ ${chunks.length} chunks created`;

  document.getElementById("chunksOutput").innerHTML =
    chunks.map((c, i) =>
      `<div class="chunk"><b>Chunk ${i + 1}</b><br>${c}</div>`
    ).join("");
}

/* ======================
   STEP 3: EMBEDDINGS
   ====================== */
function generateEmbeddings() {
  // Create fake but realistic embeddings (10-dimensional vectors)
  embeddings = chunks.map(() =>
    Array.from({ length: 10 }, () => Math.random().toFixed(3))
  );

  // Store embeddings in localStorage (simulating a vector DB)
  localStorage.setItem("vectorDB", JSON.stringify(embeddings));

  document.getElementById("embeddingStatus").innerText =
    "✅ Embeddings generated & stored locally";

  document.getElementById("embeddingsOutput").innerHTML =
    embeddings.map((v, i) =>
      `<div class="vector">Chunk ${i + 1}: [${v.join(", ")}]</div>`
    ).join("");
}

/* ======================
   COSINE SIMILARITY
   ====================== */
function cosineSimilarity(a, b) {
  let dot = 0, magA = 0, magB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    magA += a[i] ** 2;
    magB += b[i] ** 2;
  }
  return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}

/* ======================
   STEP 4: RETRIEVAL
   ====================== */
function retrieveChunks() {
  const k = Number(document.getElementById("topK").value);

  // Fake query embedding
  const queryEmbedding =
    Array.from({ length: 10 }, () => Math.random());

  const scored = embeddings.map((e, i) => ({
    chunk: chunks[i],
    score: cosineSimilarity(e.map(Number), queryEmbedding)
  }));

  topChunks = scored
    .sort((a, b) => b.score - a.score)
    .slice(0, k);

  document.getElementById("retrievalOutput").innerHTML =
    topChunks.map(c =>
      `<div>
        <span class="score">Score: ${c.score.toFixed(3)}</span><br>
        ${c.chunk}
      </div><hr>`
    ).join("");
}

/* ======================
   STEP 5 & 6: PROMPT + LLM
   ====================== */
function generateAnswer() {
  const query = document.getElementById("queryInput").value;

  const prompt = `
You are an AI assistant.
Answer the question using only the context below.

Context:
${topChunks.map(c => "- " + c.chunk).join("\n")}

Question:
${query}
`;

  // Simulated LLM response
  const answer =
`🧠 Generated Answer (Simulated)

The answer is created using the retrieved Top-K chunks.
This shows how RAG grounds LLM responses in external data.
`;

  document.getElementById("finalOutput").innerText =
    "PROMPT SENT TO LLM:\n" + prompt + "\n\n" + answer;
}
</script>

</body>
</html>
